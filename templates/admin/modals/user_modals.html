<!-- Disable User Modal -->
<div class="modal fade" id="disableUserModal" tabindex="-1" aria-labelledby="disableUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="disableUserModalLabel">사용자 비활성화</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="disableUserForm" method="post">
                <div class="modal-body">
                    <p>사용자 <strong id="disableUserUsername"></strong>을(를) 비활성화하시겠습니까?</p>
                    <div class="mb-3">
                        <label for="disableReason" class="form-label">비활성화 이유 (선택사항)</label>
                        <textarea class="form-control" id="disableReason" name="reason" rows="3"></textarea>
                    </div>
                    <input type="hidden" id="disableUserFormUsername" name="username" value="">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-danger">비활성화</button>
                </div>
            </form>
        </div>
    </div>
</div>
